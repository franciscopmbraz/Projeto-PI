<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Votação Eletrónica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Bem-vindo</h2>
        
        <div class="signup-box">
            <p> Crie uma conta para conseguir votar</p>
            
            <form id="formsignup">
                
                <label>Número de Aluno:</label>
                <input type="text" id="numero_aluno" placeholder="Ex: 12345" required>

                <label>Turma:</label>
                <select id="ano" required>
                    <option value="" disabled selected>Selecione a turma</option>
                    <option value="10A">10.º A</option>
                    <option value="10B">10.º B</option>
                    <option value="10C">10.º C</option>
                    <option value="11A">11.º A</option>
                    <option value="11B">11.º B</option>
                    <option value="11C">11.º C</option>
                    <option value="12A">12.º A</option>
                    <option value="12B">12.º B</option>
                    <option value="12C">12.º C</option>
                </select>


                <label>Palavra-passe:</label>
                <input type="password" id="senha" placeholder="senha escolar" required>

                <button class="btn-login"> Sign Up </button>
            </form>
        </div>
    </div>
<script src="jason/config.js"></script>
<script src="jason/signup.js"></script>
</body>
</html>
