<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Votação Eletrónica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Bem-vindo</h2>
        
        <div class="signup-box">
            <p> Crie uma conta para conseguir votar</p>
            
            <form id="formsignup">
                
                <label>Número de Aluno:</label>
                <input type="text" id="numero_aluno" placeholder="Ex: 12345" required>

                <label>Ano escolar:</label>
                <input type="text" id="ano" placeholder="Ex: 2023" required>

                <label>Palavra-passe:</label>
                <input type="password" id="senha" placeholder="senha escolar" required>

                <button class="btn-login"> Sign Up </button>
            </form>
        </div>
    </div>
    <script src="/frontend/jason/config.js"></script>
    <script src="/frontend/jason/signup.js"></script>
</body>
</html>
