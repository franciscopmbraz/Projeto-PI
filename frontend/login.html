<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Votação Eletrónica</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Bem-vindo</h2>
        
        <div class="login-box">
            <p>Por favor, faça o login para votar</p>
            
            <form id="formLogin">
                
                <label>Número de Aluno:</label>
                <input type="text" id="numero_aluno" placeholder="Ex: 12345" required>
                
                <label>Palavra-passe:</label>
                <input id="senha" placeholder="A tua senha escolar" required>
                
                <button class="btn-login"> login </button>

                <button class="btn-signup"> Sign Up </button>
            </form>
        </div>
    </div>
    
    <script src="/frontend/jason/config.js"></script>
    <script src="/frontend/jason/login.js"></script>
</body>
</html>
