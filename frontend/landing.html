<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Painel de Votação - SVE</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <nav class="top-bar">
        <div class="logo"><strong>SVE</strong> - Escola</div>
        <div class="conta-utilizador">
            <span>Definições da Conta</span>
        </div>
    </nav>

    <div class="container-landing">
        
        <div class="aviso-badge">
            Podes votar em ambas as modalidades!
        </div>

        <main class="cards-wrapper">
            
            <div class="card">
                <div class="icon-box icon-lista">👥</div>
                <h3>Eleição da Lista</h3>
                <p>Vota na associação de estudantes que irá representar a tua escola.</p>
                <button class="btn-escolher btn-azul">Escolher Lista</button>
            </div>

            <div class="card">
                <div class="icon-box icon-delegado">👤</div>
                <h3>Eleição do Delegado</h3>
                <p>Vota no colega que melhor representa a tua turma.</p>
                <button class="btn-escolher btn-castanho">Escolher Delegado</button>
            </div>

        </main>

    </div>
<script src="/frontend/jason/config.js"></script>
<script src="/frontend/jason/landing.js"></script>
</body>
</html>
