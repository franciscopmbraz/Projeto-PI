<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Painel de Votação - SVE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/landing.css">
    <link rel="stylesheet" href="../css/navbar.css">
</head>
<body>

    <div class="container-fluid p-3">
        <div class="row g-3">

            <div class="col-md-6">
                <div class="panel h-100">
                    <div class="panel-header ativa">
                        <h2>Eleições ativas</h2>
                    </div>
                    <div class="votacoes_ativas p-2 d-flex flex-column gap-2"></div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="panel h-100">
                    <div class="panel-header completa">
                        <h2>Eleições encerradas</h2>
                    </div>
                    <div class="votacoes_completas p-2 d-flex flex-column gap-2"></div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/landing.js"></script>
</body>
</html>
