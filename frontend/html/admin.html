<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>SVE - Administração</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <div class="container p-3">
        <div class="row g-3">

            <div class="col-12">
                <div class="panel">
                    <div class="panel-header d-flex align-items-center justify-content-between">
                        <h2>Votações de Delegado</h2>
                        <button class="btn btn-sm btn-primary" onclick="abrirModalDelegado()">
                            <i class="bi bi-plus-lg"></i> Nova
                        </button>
                    </div>
                    <div id="lista-delegado" class="p-2 d-flex flex-column gap-2"></div>
                </div>
            </div>

            <div class="col-12">
                <div class="panel">
                    <div class="panel-header d-flex align-items-center justify-content-between">
                        <h2>Votações de Lista</h2>
                        <button class="btn btn-sm btn-primary" onclick="abrirModalLista()">
                            <i class="bi bi-plus-lg"></i> Nova
                        </button>
                    </div>
                    <div id="lista-lista" class="p-2 d-flex flex-column gap-2"></div>
                </div>
            </div>

        </div>
    </div>

    <!-- Modal Delegado -->
    <div class="modal fade" id="modalDelegado" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nova Votação de Delegado</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Título</label>
                        <input type="text" class="form-control" id="del-titulo">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Turma</label>
                        <select class="form-select" id="del-turma" onchange="carregarUtilizadoresDaTurma(this.value)"></select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Candidatos</label>
                        <div id="del-candidatos">
                            <p class="text-muted small">Selecione uma turma primeiro.</p>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Data de início</label>
                        <input type="datetime-local" class="form-control" id="del-start">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Data de fim</label>
                        <input type="datetime-local" class="form-control" id="del-end">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-primary" onclick="criarDelegado()">Criar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Lista -->
    <div class="modal fade" id="modalLista" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nova Votação de Lista</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Título</label>
                        <input type="text" class="form-control" id="lista-titulo">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Candidatos</label>
                        <div id="lista-candidatos" class="d-flex flex-column gap-1"></div>
                        <button type="button" class="btn btn-sm btn-outline-secondary mt-2" onclick="addCandidatoLista()">
                            <i class="bi bi-plus"></i> Adicionar candidato
                        </button>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Data de início</label>
                        <input type="datetime-local" class="form-control" id="lista-start">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Data de fim</label>
                        <input type="datetime-local" class="form-control" id="lista-end">
                    </div>
                </div>
                <div class="modal-footer">  <!-- ✅ this was missing -->
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-primary" onclick="criarLista()">Criar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
