<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Votação Eletrónica</title>
    
    <link rel="stylesheet" href="../css/login_signup.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/navbar.css">
</head>


<body>
    <div class="container">
        <h2>Bem-vindo</h2>
        
        <div class="login-box">
            <p>Por favor, faça o login para votar</p>
            
            <form id="formLogin">
                
                <label>Número de Aluno:</label>
                <input type="text" id="aluno" placeholder="Ex: 12345" required>

                <label>Palavra-passe:</label>
                <input type="password" id="senha" placeholder="A tua senha escolar" required>

                <button type="submit" id="loginBtn" class="confirm_auth"> Login </button>

                <label>Não tens uma conta?</label>
                <button type="button" id="signupRedirectBtn" class="redirect_auth" onclick="window.location.href='signup.html'">Sign Up</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/login.js"></script>

</body>
</html>
