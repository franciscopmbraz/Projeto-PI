<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>SVE - Votação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/votacao.css">
    <link rel="stylesheet" href="../css/navbar.css">
</head>
<body>
    <div class="page-wrapper">

        <div id="view-votacao">
            <div class="header-card">
                <div class="d-flex align-items-center justify-content-between mb-2">
                    <span id="tipo-badge" class="tipo-badge"></span>
                    <span id="end-date" class="text-muted small"></span>
                </div>
                <h2 id="titulo-eleicao" class="titulo">A carregar...</h2>
                <div class="meta"><i class="ti ti-users"></i> <span id="num-candidatos"></span></div>
            </div>

            <p class="section-label">Selecione um candidato</p>

            <div id="lista-opcoes"></div>

            <div class="btn-row">
                <button class="btn-cancelar" onclick="window.location.href='landing.html'">Cancelar</button>
                <button id="btn-votar" class="btn-votar" disabled>Confirmar voto</button>
            </div>
        </div>

        <div id="view-resultados" style="display:none">
            <div class="header-card">
                <div class="d-flex align-items-center justify-content-between mb-2">
                    <span id="tipo-badge-res" class="tipo-badge"></span>
                    <span class="encerrada-badge">Encerrada</span>
                </div>
                <h2 id="titulo-resultados" class="titulo"></h2>
                <div class="meta"><i class="ti ti-chart-bar"></i> <span id="total-votos"></span></div>
            </div>
            <div id="motivo-banner" class="motivo-banner" style="display:none"></div>
            <p class="section-label">Resultados</p>
            <div id="lista-resultados"></div>

            <div class="btn-row">
                <button class="btn-cancelar" onclick="window.location.href='landing.html'">Voltar</button>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/votacao.js"></script>
</body>
</html>
