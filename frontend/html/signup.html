<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Votação Eletrónica</title>
    <link rel="stylesheet" href="../css/login_signup.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/navbar.css">
</head>

<body>
    <div class="container">
        <h2>Bem-vindo</h2>
        
        <div class="signup-box">
            <p> Crie uma conta para conseguir votar</p>
            
            <form id="formsignup">
                
                <label>Número de Aluno:</label>
                <input type="text" id="numero_aluno_input" placeholder="Ex: 12345" required>

                <label>Nome Completo:</label>
                <input type="text" id="nome_input" placeholder="O teu nome completo" required>

                <label>Turma:</label>
                <select id="turma_select" required>
        
                </select>

                <label>Palavra-passe:</label>
                <input type="password" id="senha_input" placeholder="senha escolar" required>

                <label>Confirmar Palavra-passe:</label>
                <input type="password" id="confirmar_senha_input" placeholder="confirma a senha" required>

                <button type="submit" id="signupBtn" class="confirm_auth"> Sign Up </button>
                <label>Já tens uma conta?</label>
                <button type="button" id="loginRedirectBtn" class="redirect_auth" onclick="window.location.href='login.html'">Login</button>
                
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/signup.js"></script>
</body>
</html>
