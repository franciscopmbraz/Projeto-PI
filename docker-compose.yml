services:
    #Frontend (Interface do Utilizador)
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend
  #Backend (API em FastAPI)
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - DB_USER=user_votacao
      - DB_PASSWORD=senha_segura
      - DB_NAME=sve_db
      - DB_HOST=db
    depends_on:
      - db

    #Base de Dados (MariaDB)
  db:
    image: mariadb:10.11
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: sve_db
      MARIADB_USER: user_votacao
      MARIADB_PASSWORD: senha_segura
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

# Volume permanente para guardar os votos com segurança
volumes:
  db_data: